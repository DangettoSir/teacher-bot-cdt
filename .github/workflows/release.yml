name: Docker Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Read version
        id: version
        shell: bash
        run: |
          VERSION=$(cat VERSION | tr -d '[:space:]')
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Check version
        shell: bash
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"

          if [ "$TAG_VERSION" != "${{ steps.version.outputs.version }}" ]; then
            echo "VERSION (${{ steps.version.outputs.version }}) does not match tag ($TAG_VERSION)"
            exit 1
          fi

      - name: Build Docker image
        run: |
          docker build \
            -t teacher-bot-cdt:${{ steps.version.outputs.version }} \
            -t teacher-bot-cdt:latest \
            .

      - name: Export Docker image
        run: |
          docker save \
            teacher-bot-cdt:${{ steps.version.outputs.version }} \
            -o teacher-bot-cdt-v${{ steps.version.outputs.version }}.tar

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: v${{ steps.version.outputs.version }}
          tag_name: v${{ steps.version.outputs.version }}
          generate_release_notes: true
          files: |
            teacher-bot-cdt-v${{ steps.version.outputs.version }}.tar